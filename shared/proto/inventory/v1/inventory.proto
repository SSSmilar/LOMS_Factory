syntax = "proto3";

package inventory.v1;


option go_package = "github.com/SSSmilar/LOMS_Factory/shared/pkg/proto/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  rpc ListParts(ListPartsRequest) returns(ListPartsResponse);
}


// Тип детали
enum PartType {
  PART_TYPE_UNSPECIFIED = 0;//Не указан
  PART_TYPE_HULL = 1;//Корпус корабля
  PART_TYPE_ENGINE = 2;//Двигатель
  PART_TYPE_SHIELD = 3 ; // Защитный щит
  PART_TYPE_WEAPON = 4 ; //Вооружение
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;

  // Название детали
  string name = 2;

  // Описание детали
  string description = 3;

  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;

  //Тип детали (enum)
  PartType part_type = 5  ;

  //Количество на складе
  int64 stock_quantity = 6 ;

  //Дата создания
  google.protobuf.Timestamp created_at = 7 ;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  string uuid = 1; //Идентификатор детали
}
//Ответ на запрос о получение детали
message GetPartResponse {
  Part part  = 1 ;//    Информация о детали
}

message ListPartsRequest {
    PartType partTyper = 1 ; // Фильтр по типу (UNSPECIFIED = все детали)
    repeated string  uuids = 2 ;//Опционально: конкретные UUID (приоритет над part_type)
}

message ListPartsResponse {
    repeated Part parts = 1 ; //Список найденных деталей
}
